# CI/CD: test, build and deploy to Azure App Service on every push to main.
#
# One-time setup:
#   1. Create the App Service (see docs/AZURE_DEPLOYMENT.md).
#   2. In the Azure Portal open the App Service > Overview > "Download publish profile".
#   3. In GitHub: Settings > Secrets and variables > Actions > New repository secret
#        AZURE_WEBAPP_PUBLISH_PROFILE = <contents of the publish profile file>
#   4. Set the variable AZURE_WEBAPP_NAME (Settings > Variables) to your App Service name.

name: Build and deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install & test API
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble deployment package
        run: |
          rm -rf backend/public
          cp -r frontend/dist backend/public
          cd backend
          # node_modules is excluded: App Service runs `npm install` itself
          # because SCM_DO_BUILD_DURING_DEPLOYMENT=true (see docs/AZURE_DEPLOYMENT.md)
          zip -r ../deploy.zip . -x "node_modules/*" "data/*" "uploads/*" "test/*" ".env"

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Skipped until the Azure settings exist, so the build still shows green
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy.zip
